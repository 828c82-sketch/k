<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMOLED ㅋㄷ창</title>
    <style>
/* 기존 스타일 전체 복사 (원본 그대로 유지) */ * { box-sizing: border-box; font-family: sans-serif; } body { margin: 0; padding: 0; background: #000000; color: #ffffff; display: flex; flex-direction: column; height: 100vh; } #top-right-area { position: fixed; top: 10px; right: 10px; width: min(220px, 30vw); max-width: 220px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,0.85); padding: 10px; border: 1px solid #333; } .toggle-label, .mt-label { color: #888888; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 4px; } #mt-input { background: #111; border: 1px solid #444; color: #d4a359; padding: 4px; width: 80px; font-size: 12px; text-align: center; } textarea { width: 100%; height: 100px; padding: 8px; font-size: 13px; font-weight: normal; border: 1px solid #333333; background: #000000; color: #cccccc; resize: none; word-break: break-all; } #chat-scroll-area { flex: 1; overflow-y: auto; padding: 15px; padding-right: 240px; background: #000000; }

.user-box { font-size: 13px; font-weight: normal; color: #ffffff; margin: 15px 0; word-break: break-all; line-height: 1.4; } .ai-box { font-size: 13px; font-weight: normal; color: #d4a359; margin: 15px 0 25px 0; word-break: break-all; line-height: 1.4; } .system-box { font-size: 11px; color: #ff9800; margin: 10px 0; white-space: pre-wrap; } .reasoning-box { color: #666666; font-size: 11px; font-weight: normal; margin-bottom: 6px; white-space: pre-wrap; } .code-container { background-color: #111111; color: #d4d4d4; margin: 8px 0; border: 1px solid #222; font-family: monospace; } .code-header { display: flex; justify-content: space-between; align-items: center; background-color: #1c1c1c; padding: 3px 8px; font-size: 11px; color: #777777; } .copy-btn { background-color: #222222; color: #aaaaaa; border: 1px solid #444; padding: 2px 6px; cursor: pointer; font-size: 10px; } .code-container pre { margin: 0; padding: 8px; overflow-x: auto; white-space: pre; font-size: 12px; font-weight: normal; } 


    </style>
</head>
<body>
    <div id="top-right-area">
        <label class="toggle-label"><input type="checkbox" id="reasoning-toggle">추론 표시</label>
        <div class="mt-label"><span>맥스토큰:</span><input type="number" id="mt-input" value="4096" onchange="setGlobalMaxTokens(this.value)"></div>
        <textarea id="msg" placeholder="질문 후 엔터(Enter) 전송..." onkeydown="handleEnter(event)"></textarea>
    </div>
    <div id="chat-scroll-area"></div>

<script>
    let socket;
    const chatContainer = document.getElementById('chat-scroll-area');

    function appendSafeTextNode(element, text) {
        if (!text) return;
        text.split('\n').forEach((p, i, arr) => {
            element.appendChild(document.createTextNode(p));
            if (i < arr.length - 1) element.appendChild(document.createElement('br'));
        });
    }

    function appendMessageDOM(role, content) {
        const box = document.createElement('div');
        box.className = role === 'user' ? 'user-box' : 'ai-box';
        if (role === 'user') box.appendChild(document.createTextNode('나: '));
        appendSafeTextNode(box, content);
        chatContainer.appendChild(box);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendSystemMsg(msgText) {
        const box = document.createElement('div');
        box.className = 'system-box';
        box.textContent = '⚙️ ' + msgText;
        chatContainer.appendChild(box);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${window.location.host}/ws`);

        socket.onopen = () => appendSystemMsg("✅ Python 서버 연결됨");
socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            // 👇 [여기 3줄 추가됨!] 서버에서 보내주는 이전 대화 불러와서 화면에 그리기
            if (data.type === "init_history") {
                appendMessageDOM(data.role, data.content);
            } else if (data.type === "stream_chunk") {
                let lastAi = chatContainer.querySelector('.ai-box:last-child');
                if (!lastAi || lastAi.dataset.done === "true") {
                    lastAi = document.createElement('div');
                    lastAi.className = 'ai-box';
                    chatContainer.appendChild(lastAi);
                }
                appendSafeTextNode(lastAi, data.content);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } else if (data.type === "system") {
                appendSystemMsg(data.content);
            } else if (data.type === "done") {
                const lastAi = chatContainer.querySelector('.ai-box:last-child');
                if (lastAi) lastAi.dataset.done = "true";
            }
        };


        socket.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    function setGlobalMaxTokens(val) {
        const tokens = parseInt(val) || 4096;
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "update_setting", maxTokens: tokens }));
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const inputEl = document.getElementById('msg');
            const text = inputEl.value.trim();
            if (text) {
                if (!text.startsWith("***")) appendMessageDOM('user', text);
                inputEl.value = '';
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: "user_input", content: text }));
                }
            }
        }
    }

    window.onload = connectWebSocket;
</script>
</body>
</html>
